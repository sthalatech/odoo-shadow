# GitHub Actions hook: a new issue -> odoo-synth environment + AI agent.
#
# Triggered when an issue is OPENED. It matches the issue's repo to an
# odoo-synth profile (by addons repo URL -- the same preset the Coder
# dashboard would offer), launches a Coder env labelled with the issue # +
# short name, waits for it to come up, then drives opencode inside it via
# ralph-wiggum (baked into the golden AMI) with the issue details as the task
# and the project system prompt as context.
#
# The runner needs AWS + Coder creds (the env control plane) and the odoo-synth
# CLI + repo checked out. Self-hosted on the odoo-synth VM is the natural fit
# (the CLI + coder + awscli are already installed there); use a hosted runner
# only if you wire the same secrets.
name: issue-env

on:
  issues:
    types: [opened]

  # Manual trigger for testing/retro-fitting an existing issue. Pass the issue
  # number + (optional) repo URL; the workflow fetches its title/body via the
  # GitHub API and runs the same launcher.
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to launch an env for"
        required: true
      issue_repo_url:
        description: "Addons repo URL to match (defaults to this repo's clone URL)"
        required: false

# Never run more than one issue-env per issue at a time; the env launcher is
# idempotent-ish but two concurrent runs would create two envs for one issue.
concurrency:
  group: issue-env-${{ github.event.issue.number || github.event.inputs.issue_number }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: read

jobs:
  launch:
    runs-on: [self-hosted, odoo-synth]   # the VM with odoo-synth + coder + awscli
    timeout-minutes: 90
    env:
      # The env control plane. The self-hosted runner reads these from its own
      # environment; mirror them as repo Actions secrets if you switch to a
      # hosted runner. CODER_URL + CODER_SESSION_TOKEN drive `coder create`.
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      ODOO_SYNTH_AGENT: ${{ vars.ODOO_SYNTH_AGENT || 'opencode' }}
      ODOO_SYNTH_MAX_ITER: ${{ vars.ODOO_SYNTH_MAX_ITER || '15' }}
      # Optional: pin the addons branch to check out (defaults to the profile's ref).
      ODOO_SYNTH_BRANCH_HINT: ${{ vars.ODOO_SYNTH_BRANCH_HINT }}
      # Optional: override the post-launch module upgrade list (comma-separated).
      # Empty => the profile's discovered installed modules, else `-u all`.
      ODOO_SYNTH_UPGRADE_MODULES: ${{ vars.ODOO_SYNTH_UPGRADE_MODULES }}
    steps:
      - name: Checkout repo (for the launcher + system prompt)
        uses: actions/checkout@v4

      - name: Resolve issue payload
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if [ -n "${{ github.event.issue.number }}" ]; then
            # issues webhook path
            NUM="${{ github.event.issue.number }}"
            TITLE="${{ github.event.issue.title }}"
            URL="${{ github.event.issue.html_url }}"
            # body can be huge / multi-line; pull it from the event JSON to keep
            # quoting sane rather than interpolating into the shell.
            BODY="$(jq -r '.issue.body // ""' "$GITHUB_EVENT_PATH")"
            # The addons repo to match: the issue's repository clone URL.
            REPO_URL="${{ github.event.repository.clone_url }}"
          else
            # workflow_dispatch path: fetch the issue via the GitHub API.
            NUM="${{ github.event.inputs.issue_number }}"
            REPO_URL="${{ github.event.inputs.issue_repo_url || github.event.repository.clone_url }}"
            if [ -z "$REPO_URL" ]; then REPO_URL="${{ github.event.repository.clone_url }}"; fi
            ISSUE_JSON="$(gh api repos/${{ github.repository }}/issues/"$NUM" --jq '.')"
            TITLE="$(printf '%s' "$ISSUE_JSON" | jq -r '.title')"
            URL="$(printf '%s' "$ISSUE_JSON" | jq -r '.html_url')"
            BODY="$(printf '%s' "$ISSUE_JSON" | jq -r '.body // ""')"
          fi
          {
            echo "ISSUE_NUMBER=$NUM"
            echo "ISSUE_TITLE=$TITLE"
            echo "ISSUE_URL=$URL"
            echo "ISSUE_REPO_URL=$REPO_URL"
          } >> "$GITHUB_ENV"
          # Body can be multi-line; write via a heredoc-protected file env.
          printf '%s' "$BODY" > /tmp/issue_body.txt
          echo "ISSUE_BODY<<EOF" >> "$GITHUB_ENV"
          cat /tmp/issue_body.txt >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"
          echo "resolved issue #$NUM: $TITLE"

      - name: Create env + launch agent
        run: |
          set -eu
          python3 scripts/issue_to_env.py
        env:
          ISSUE_NUMBER: ${{ env.ISSUE_NUMBER }}
          ISSUE_TITLE: ${{ env.ISSUE_TITLE }}
          ISSUE_BODY: ${{ env.ISSUE_BODY }}
          ISSUE_URL: ${{ env.ISSUE_URL }}
          ISSUE_REPO_URL: ${{ env.ISSUE_REPO_URL }}
          ODOO_SYNTH_AGENT: ${{ env.ODOO_SYNTH_AGENT }}
          ODOO_SYNTH_MAX_ITER: ${{ env.ODOO_SYNTH_MAX_ITER }}
          ODOO_SYNTH_BRANCH_HINT: ${{ env.ODOO_SYNTH_BRANCH_HINT }}
          ODOO_SYNTH_UPGRADE_MODULES: ${{ env.ODOO_SYNTH_UPGRADE_MODULES }}
          # AWS + Coder creds come from the runner env (self-hosted) or secrets.
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID || '' }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY || '' }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN || '' }}
          CODER_URL: ${{ secrets.CODER_URL || env.CODER_URL }}
          CODER_SESSION_TOKEN: ${{ secrets.CODER_SESSION_TOKEN || env.CODER_SESSION_TOKEN }}

      - name: Comment env status on the issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # Best-effort status comment; do not fail the workflow on comment error.
          BODY="🤖 odoo-synth env launcher ran for this issue (run ${{ github.run_id }}). See the [workflow logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for the env + agent result."
          gh issue comment "${{ env.ISSUE_NUMBER }}" --body "$BODY" 2>/dev/null || true
